function renderClassList(classes){
  if(!classes.length) return `<div class="empty-tip">还没有班级。建一个，把班级码发给学生。</div>`;
  return classes.map(c=>{
    const sc = loadScores();
    const avg = c.members.length ? Math.round(c.members.reduce((s,no)=> s+(sc[no]?.score||0),0)/c.members.length) : 0;
    return `<div class="class-item">
      <div style="flex:1">
        <div class="cname">${c.name}${c.assigned?` <span class="chip" style="font-size:12px;padding:1px 8px">所带班级</span>`:""}</div>
        <div class="cmeta">${c.members.length} 人 · 平均 ${avg} 分 · 班级码 <code>${c.code}</code></div>
      </div>
      <button class="btn ghost" onclick="openPick(${c.id})">添加学生</button>
    </div>`;
  }).join("");
}

let pickClassId = null;
function openPick(cid){
  pickClassId = cid;
  const classes = loadClasses();
  const cls = classes.find(c=>c.id===cid);
  const inClass = new Set(cls.members);
  const candidates = allAccounts("s").filter(a=> !inClass.has(a.id));
  document.getElementById("pickTitle").textContent = `添加学生到「${cls.name}」`;
  document.getElementById("pickBody").innerHTML = candidates.length ?
    candidates.map(a=>`<label style="display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px">
      <input type="checkbox" class="pickChk" value="${a.id}">
      <span style="font-weight:600">${a.name}</span><span style="color:var(--ink-3)">${a.id}</span>
      <span style="color:var(--ink-3);margin-left:auto">${a.cls||""}</span>
    </label>`).join("")
    : `<div class="empty-tip">账号表中没有可添加的学生了。</div>`;
  document.getElementById("pickMask").classList.add("on");
}
function closePick(){ document.getElementById("pickMask").classList.remove("on"); }
function confirmPick(){
  const ids = [...document.querySelectorAll(".pickChk:checked")].map(c=>c.value);
  if(ids.length){
    const classes = loadClasses();
    const cls = classes.find(c=>c.id===pickClassId);
    ids.forEach(id=>{ if(!cls.members.includes(id)) cls.members.push(id); });
    saveClasses(classes);
  }
  closePick(); renderTeacher();
}

function renderStuSection(classes, scores){
  const tabs = `<div class="tabs">
    <div class="tab ${teacherTab==="all"?"on":""}" onclick="setTeacherTab('all')">全部学生</div>
    ${classes.map(c=>`<div class="tab ${teacherTab===String(c.id)?"on":""}" onclick="setTeacherTab('${c.id}')">${c.name}</div>`).join("")}
  </div>`;
  const sortBar = `<div class="sort-bar">
    <span class="lbl">排序：</span>
    <button class="sort-btn ${teacherSort==="id"?"on":""}" onclick="setTeacherSort('id')">按学号</button>
    <button class="sort-btn ${teacherSort==="scoreAsc"?"on":""}" onclick="setTeacherSort('scoreAsc')">分数升序</button>
    <button class="sort-btn ${teacherSort==="scoreDesc"?"on":""}" onclick="setTeacherSort('scoreDesc')">分数降序</button>
  </div>`;
  const rows = stuRows(classes, scores);
  const table = rows.length ? `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>排名</th><th>姓名</th><th>学号</th><th>班级</th><th class="num">最高关卡</th><th class="num">累计积分</th><th class="num">掌握人数</th><th>最近学习</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td class="rank">${i+1}</td><td><b>${r.name}</b></td><td class="num">${r.no}</td><td>${r.cls}</td>
      <td class="num">Lv ${r.best}</td><td class="num sc">${r.score}</td><td class="num">${r.done}/${DB.length}</td><td>${r.last}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<div class="empty-tip">还没有学生。到「学生管理」用「+ 添加学生」把账号加入班级，或先建一个班级。</div>`;
  return tabs + sortBar + table;
}
function setTeacherTab(t){ teacherTab=t; renderTeacher(); }
function setTeacherSort(s){ teacherSort=s; renderTeacher(); }
function stuRows(classes, scores){
  let members;
  if(teacherTab==="all"){
    const set = new Set(); classes.forEach(c=> c.members.forEach(m=> set.add(m)));
    members = [...set];
  } else {
    const cls = classes.find(c=> String(c.id)===teacherTab);
    members = cls ? cls.members : [];
  }
  let rows = members.map(no=>{
    const acc = findStudent(no) || {name:"?", cls:""};
    const s = scores[no] || {};
    return { no, name:acc.name, cls:acc.cls||"—", best:s.bestLevel||1, score:s.score||0, done:s.doneCount||0, last:s.lastDate||"—" };
  });
  if(teacherSort==="id") rows.sort((a,b)=> a.no.localeCompare(b.no));
  else if(teacherSort==="scoreAsc") rows.sort((a,b)=> a.score-b.score);
  else rows.sort((a,b)=> b.score-a.score);
  return rows;
}

/* ============================================================
   关系网（教师 / 管理员共用）
============================================================ */
function netEdges(){
  const names = new Set(DB.map(p=>p.name));
  const seen = new Set(), edges = [];
  DB.forEach(p=> (p.lore||[]).forEach(l=>{
    if(!names.has(l.b)) return;
    const k = [p.name, l.b].sort().join("|");
    if(seen.has(k)) return;
    seen.add(k);
    edges.push({ a:p.name, b:l.b });
  }));
  return edges;
}
function isLit(name){ return ((prof.done||{})[personKey(name)]||0) > 0; }

function netDegree(edges){
  const d = {};
  edges.forEach(e=>{ d[e.a]=(d[e.a]||0)+1; d[e.b]=(d[e.b]||0)+1; });
  return d;
}

function renderNet(){
  const edges = netEdges();
  const deg = netDegree(edges);
  const litPeople = DB.filter(p=>isLit(p.name)).length;

  const cols = [];
  const vis = new Set();
  NET_DYNS.forEach(dyn=>{
    const people = DB.filter(p=> p.dyn===dyn).slice()
      .sort((a,b)=> (isLit(b.name)?1:0)-(isLit(a.name)?1:0)
        || (deg[b.name]||0)-(deg[a.name]||0)
        || ((a.no||0)-(b.no||0)))
      .slice(0, NET_COL_MAX);
    if(!people.length) return;
    people.forEach(p=> vis.add(p.name));
    cols.push({ dyn, people });
  });
  const visEdges = edges.filter(e=> vis.has(e.a) && vis.has(e.b)).length;

  let html = `<div class="net-head">
    <div class="t">关系网</div>
    <div class="st">已点亮 <b>${litPeople}</b> / ${DB.length} 人 · 当前可见连线 <b>${visEdges}</b> 条 / 全库 ${edges.length} 条 · 每列至多 ${NET_COL_MAX} 人</div>
  </div>
  <div class="net-scroll"><div class="net-stage" id="netStage">
    <svg class="net-links" id="netLinks"></svg>
    <div class="net-cols">`;

  cols.forEach(({dyn, people})=>{
    html += `<div class="net-col"><div class="line"></div>
      <div class="era">${NET_DYN_SHORT[dyn]||dyn}</div>
      <div class="nodes">`;
    people.forEach(p=>{
      html += `<div class="net-node${isLit(p.name)?" lit":""}" data-name="${p.name}" onclick="selectNetPerson('${p.name}')">${p.name}</div>`;
    });
    html += `</div></div>`;
  });

  html += `</div></div></div>
  <div class="net-tip" id="netTip">点一个人，看他在这张网里的位置。</div>`;
  return html;
}

function netDetailHTML(name){
  const p = DB.find(x=> x.name===name);
  if(!p) return "点一个人，看他在这张网里的位置。";
  const tags = [p.dyn];
  if(p.caliber) tags.push("字/号 " + p.caliber);
  const links = (p.lore||[]).map(l=>{
    const lit = isLit(name) && isLit(l.b);
    return `连线：<b>${l.b}</b>（${l.text}）<em class="${lit?"lit":""}">${lit?"已点亮":"未点亮"}</em>`;
  }).join("<br>");
  return `<div class="nd-head"><b>${p.name}</b>${tags.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="nd-desc">${p.event} · 作品：${p.work}</div>
    <div class="nd-links">${links || "暂无可连线的人物"}</div>`;
}

function selectNetPerson(name){
  document.querySelectorAll(".net-node").forEach(el=> el.classList.toggle("sel", el.dataset.name===name));
  document.getElementById("netTip").innerHTML = netDetailHTML(name);
  drawNetLinks();
}

function drawNetLinks(){
  const stage = document.getElementById("netStage");
  const svg = document.getElementById("netLinks");
  if(!stage || !svg) return;
  const sr = stage.getBoundingClientRect();
  if(!sr.width || !sr.height) return;
  svg.setAttribute("viewBox", `0 0 ${sr.width} ${sr.height}`);
  const pos = {};
  stage.querySelectorAll(".net-node").forEach(n=>{
    const r = n.getBoundingClientRect();
    pos[n.dataset.name] = { x: r.left - sr.left + r.width/2, y: r.top - sr.top + r.height/2 };
  });
  const selEl = stage.querySelector(".net-node.sel");
  const sel = selEl ? selEl.dataset.name : "";
  let paths = "";
  netEdges().forEach(({a,b})=>{
    const A = pos[a], B = pos[b];
    if(!A || !B) return;
    const lit = isLit(a) && isLit(b);
    const focus = !!sel && (a===sel || b===sel);
    const dx = B.x - A.x, dy = B.y - A.y;
    let cx, cy;
    if(Math.abs(dx) < 12){ cx = A.x + 30; cy = (A.y + B.y) / 2; }
    else { cx = (A.x + B.x) / 2; cy = (A.y + B.y) / 2 - Math.min(30, Math.abs(dy)*0.4) - 8; }
    const stroke = focus ? "#2196F3" : (lit ? "#4CAF50" : "#AFC4BF");
    const w = focus ? 2.2 : (lit ? 1.6 : 1.1);
    const dash = focus ? "none" : "3 4";
    paths += `<path d="M ${A.x.toFixed(1)} ${A.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}"
      fill="none" stroke="${stroke}" stroke-width="${w}"
      stroke-dasharray="${dash}" stroke-linecap="round" opacity="${focus?1:(lit?1:.9)}"/>`;
  });
  svg.innerHTML = paths;
}

/* 分流渲染（放在所有声明之后，避免 let 的 TDZ） */
if(user.role==="t") renderTeacher();
else if(user.role==="a") renderAdmin();

/* 数据源异步升级（xlsx 直读完成）后重绘 */
window.addEventListener("hn-db-updated", () => {
  if(user.role==="t") renderTeacher();
  else if(user.role==="a") renderAdmin();
});
